services:
  rare-synth:
    build:
      context: .
      dockerfile: Dockerfile
    image: rare-synth:latest
    container_name: rare-synth
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: ["python", "-m", "rare_synth.cli", "serve-api", "--host", "0.0.0.0", "--port", "8000"]
