cohort:
  name: cbioportal-ucec

data:
  source: cbioportal
  project_id:
  workflow_type: STAR - Counts
  cbioportal_study_id: ucec_tcga_pub

preprocessing:
  n_hvg: 2000
  random_seed: 42

train:
  epochs: 100
  model: ctgan
  baseline_models: [ctgan, tvae]
  synthetic_multiplier: 3
  synthetic_min_rows: 200

validate:
  sample_ks_genes: 500
  tstr_max_genes: 200
